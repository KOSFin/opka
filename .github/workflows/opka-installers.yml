name: Opka beta installers
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: read

env:
  ORCA_BACKGROUND_LAUNCH: '1'
  ORCA_TELEMETRY_DISABLED: '1'
  HUSKY: '0'

jobs:
  server_template:
    uses: ./.github/workflows/opka-server-template.yml
    with:
      ref: ${{ github.sha }}
      build_template: true
      version: ${{ inputs.version }}

  mac:
    name: Unsigned Mac arm64 beta
    needs: server_template
    runs-on: macos-15
    timeout-minutes: 60
    env:
      OPKA_VERSION: ${{ inputs.version }}
      ORCA_LOCAL_BUILD_VERSION: ${{ inputs.version }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Ad-hoc only: no certificate secrets or keychain discovery in PR jobs.
      CSC_FOR_PULL_REQUEST: 'true'
      ORCA_REQUIRE_ORCAD_TEMPLATE: '1'
      ORCA_COMPUTER_MACOS_SIGN_IDENTITY: '-'
      ORCA_KEYBOARD_LAYOUT_MACOS_SIGN_IDENTITY: '-'
      ORCA_NOTIFICATION_STATUS_MACOS_SIGN_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
      - uses: ./.github/actions/install-mobile-dependencies
      - name: Install every architecture required by packaging guards
        run: pnpm install:release
      - name: Install Electron
        run: node config/scripts/install-electron-package-binary.mjs
      - uses: actions/download-artifact@v8
        with:
          name: orcad-template
          path: out/orcad-template
      - name: Build desktop and native Mac components
        run: |
          pnpm run build:desktop:assets
          pnpm run build:computer-macos
          pnpm run build:keyboard-layout-macos
          pnpm run build:notification-status-macos
          pnpm run ensure:electron-runtime
      - name: Package without publishing or claiming Developer ID signing
        run: pnpm exec electron-builder --config config/electron-builder.config.cjs --config.mac.identity=- --mac dmg zip --arm64 --publish never
      - name: Qualify release files and record provenance
        run: node config/scripts/opka-release-assets.mjs mac dist
      - name: Exercise the packaged CLI from a disposable home
        run: node config/scripts/smoke-packaged-cli.mjs --app-dir=dist/mac-arm64/Opka.app
      - name: Exercise the packaged task lifecycle without a model
        env:
          SKIP_BUILD: '1'
          ORCA_FORK_PACKAGED_APP: ${{ github.workspace }}/dist/mac-arm64/Opka.app
        run: pnpm exec playwright test tests/e2e/fork-packaged-tasks.spec.ts tests/e2e/fork-packaged-installer.spec.ts --config tests/playwright.config.ts --project electron-headless --workers=1
      - name: Save packaged task evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-task-evidence-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: opka-macos-${{ github.sha }}
          path: |
            dist/opka-macos-arm64.dmg
            dist/opka-macos-arm64.zip
            dist/latest-mac.yml
            dist/opka-macos-provenance.json
          if-no-files-found: error
          retention-days: 14
  android:
    name: Opka Android installer
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ github.event_name == 'workflow_dispatch' && 'opka-android-release' || 'opka-android-ci' }}
    env:
      OPKA_VERSION: ${{ inputs.version }}
      OPKA_MOBILE_BUILD: '1'
      OPKA_ANDROID_KEYSTORE_BASE64: ${{ secrets.OPKA_ANDROID_KEYSTORE_BASE64 }}
      OPKA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.OPKA_ANDROID_KEYSTORE_PASSWORD }}
      OPKA_ANDROID_CERTIFICATE_SHA256: ${{ vars.OPKA_ANDROID_CERTIFICATE_SHA256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
      - uses: ./.github/actions/install-mobile-dependencies
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Generate the separate Opka Android project
        working-directory: mobile
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Build Android APK
        working-directory: mobile/android
        run: ./gradlew :opka-app-update:testReleaseUnitTest assembleRelease --no-daemon --max-workers=3
      - name: Sign and qualify Android APK
        shell: bash
        env:
          OPKA_PUBLISHING: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          set -euo pipefail
          set +x
          export OPKA_APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          export OPKA_APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          signing_store="$RUNNER_TEMP/opka-android.jks"
          trap 'rm -f "$signing_store"' EXIT
          if [ "$OPKA_PUBLISHING" = 1 ]; then
            [ -n "$OPKA_ANDROID_KEYSTORE_BASE64" ] && [ -n "$OPKA_ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$OPKA_ANDROID_CERTIFICATE_SHA256" ] || { echo 'Configure the protected Android release signing environment first.' >&2; exit 1; }
            python3 -c 'import base64,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"opka-android.jks"; p.write_bytes(base64.b64decode(os.environ["OPKA_ANDROID_KEYSTORE_BASE64"],validate=True)); p.chmod(0o600)'
          else
            export OPKA_ANDROID_KEYSTORE_PASSWORD="$(openssl rand -hex 32)"
            keytool -genkeypair -keystore "$signing_store" -alias opka-beta -storetype JKS -keyalg RSA -keysize 3072 -validity 10 -dname 'CN=Opka CI Test' -storepass:env OPKA_ANDROID_KEYSTORE_PASSWORD -keypass:env OPKA_ANDROID_KEYSTORE_PASSWORD
          fi
          mkdir -p dist
          "$OPKA_APKSIGNER" sign --ks "$signing_store" --ks-key-alias opka-beta --ks-pass env:OPKA_ANDROID_KEYSTORE_PASSWORD --key-pass env:OPKA_ANDROID_KEYSTORE_PASSWORD --out dist/opka-android.apk mobile/android/app/build/outputs/apk/release/app-release.apk
          if [ "$OPKA_PUBLISHING" != 1 ]; then
            export OPKA_ANDROID_CERTIFICATE_SHA256="$("$OPKA_APKSIGNER" verify --print-certs dist/opka-android.apk | sed -n 's/Signer #1 certificate SHA-256 digest: //p')"
          fi
          node config/scripts/opka-android-release.mjs dist/opka-android.apk dist
      - uses: actions/upload-artifact@v7
        with:
          name: opka-android-${{ github.sha }}
          path: |
            dist/opka-android.apk
            dist/latest-android.json
            dist/opka-android-provenance.json
          if-no-files-found: error
          retention-days: 14
  release_files:
    name: Complete beta asset set
    needs: [mac, server_template, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPKA_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
      - uses: actions/download-artifact@v8
        with:
          pattern: opka-*-${{ github.sha }}
          path: dist
          merge-multiple: true
      - run: node config/scripts/opka-release-assets.mjs complete dist
      - uses: actions/upload-artifact@v7
        with:
          name: opka-beta-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
