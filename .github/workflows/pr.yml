name: PR Checks
run-name: Opka checks | ${{ github.event.pull_request.head.sha || github.sha }}

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      release_version:
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: opka-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ORCA_BACKGROUND_LAUNCH: '1'
  ORCA_TELEMETRY_DISABLED: '1'
  ORCA_DIAGNOSTICS_DISABLED: '1'
  HUSKY: '0'

jobs:
  scope:
    name: Determine required component checks
    if: ${{ !cancelled() && github.event.pull_request.draft != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      plan: ${{ steps.scope.outputs.plan }}
      static: ${{ steps.scope.outputs.static }}
      regression: ${{ steps.scope.outputs.regression }}
      desktop: ${{ steps.scope.outputs.desktop }}
      electron: ${{ steps.scope.outputs.electron }}
      installers: ${{ steps.scope.outputs.installers }}
      android: ${{ steps.scope.outputs.android }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      reused: ${{ steps.scope.outputs.reused }}
      base: ${{ steps.scope.outputs.base }}
      head: ${{ steps.scope.outputs.head }}
      full: ${{ steps.scope.outputs.full }}
      comparison_valid: ${{ steps.scope.outputs.comparison_valid }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
      - name: Resolve exact inputs and previous PR qualification
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: node config/scripts/opka-ci-component-scope.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: opka-ci-scope-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/opka-ci/
          retention-days: 7

  static:
    name: Types and changed-code quality
    needs: scope
    if: ${{ !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.static == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
      - uses: ./.github/actions/install-mobile-dependencies
        if: needs.scope.outputs.docs_only != 'true'
      - name: Fetch the exact comparison base
        env:
          OPKA_CI_DIFF_BASE: ${{ needs.scope.outputs.base }}
        run: git fetch --no-tags --depth=1 origin "$OPKA_CI_DIFF_BASE"
      - name: Reject new root-level files and folders
        env:
          OPKA_CI_DIFF_BASE: ${{ needs.scope.outputs.base }}
        run: |
          node .github/scripts/check-root-directory-entries.mjs "$OPKA_CI_DIFF_BASE" HEAD
      - name: Check types
        if: needs.scope.outputs.docs_only != 'true'
        run: pnpm tc
      - name: Check mobile application types
        if: needs.scope.outputs.docs_only != 'true'
        working-directory: mobile
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm typecheck
      - name: Check changed code
        env:
          ORCA_CODE_QUALITY_BASE: ${{ needs.scope.outputs.base }}
          GOMEMLIMIT: 6GiB
          GOMAXPROCS: '1'
          RAYON_NUM_THREADS: '1'
        run: pnpm run check:code-quality:changed
      - name: Check required context ownership
        run: pnpm exec bun .github/scripts/check-required-pr-context.mjs
      - name: Check README links
        run: node config/scripts/check-readme-local-links.mjs

  regression:
    name: Fork regression tests (${{ matrix.shard }}/4)
    needs: scope
    if: ${{ !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.regression == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPKA_FORK_TEST_SHARD_INDEX: ${{ matrix.shard }}
      OPKA_FORK_TEST_SHARD_COUNT: '4'
      NODE_OPTIONS: --max-old-space-size=1536
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
      - uses: ./.github/actions/install-mobile-dependencies
        if: matrix.shard == 1
      - name: Install the pinned headless renderer browser
        if: matrix.shard == 1
        run: node node_modules/playwright-core/cli.js install --with-deps chromium webkit
      - name: Test host accounts, mobile state and generated pages
        env:
          OPKA_MOBILE_EVIDENCE_DIR: ${{ github.workspace }}/out/mobile-web-qa
          ORCA_MOBILE_WEB_APP_DEPS_REQUIRED: '1'
          OPKA_CI_DIFF_BASE: ${{ needs.scope.outputs.base }}
          OPKA_CI_DIFF_HEAD: ${{ needs.scope.outputs.head }}
          OPKA_CI_COMPARISON_VALID: ${{ needs.scope.outputs.comparison_valid }}
        shell: bash
        run: |
          if [ "$OPKA_CI_COMPARISON_VALID" = true ]; then
            pnpm run test:fork -- --changed "$OPKA_CI_DIFF_BASE" "$OPKA_CI_DIFF_HEAD"
          else
            pnpm run test:fork
          fi
      - name: Save synthetic mobile page evidence
        if: ${{ always() && matrix.shard == 1 }}
        uses: actions/upload-artifact@v7
        with:
          name: mobile-web-ui-${{ github.sha }}
          path: out/mobile-web-qa/
          if-no-files-found: warn
          retention-days: 7
      - name: Save this shard's test selection
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fork-test-selection-${{ github.sha }}-${{ matrix.shard }}
          path: out/opka-ci/fork-test-selection.json
          if-no-files-found: warn
          retention-days: 7
      - name: Install the push gateway workspace without lifecycle scripts
        if: matrix.shard == 1
        working-directory: cloud
        run: pnpm install --frozen-lockfile --ignore-scripts --filter '@orca-cloud/push...'
      - name: Compile the push gateway and its contracts
        if: matrix.shard == 1
        working-directory: cloud
        run: |
          pnpm --filter @orca-cloud/postgres-schema build
          pnpm --filter @orca-cloud/push-contract build
          pnpm --filter @orca-cloud/push build
      - name: Check push configuration and FCM transport with synthetic credentials
        if: matrix.shard == 1
        working-directory: cloud
        run: pnpm --filter @orca-cloud/push exec vitest run src/config.test.ts src/fcm-client.test.ts --maxWorkers=1

  desktop:
    name: Desktop assets (${{ matrix.os }})
    needs: scope
    if: ${{ !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.desktop == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
      - name: Build desktop, CLI and web assets
        uses: ./.github/actions/install-mobile-dependencies
      - name: Compile desktop assets
        run: pnpm run build:desktop:assets
      - name: Save commit provenance
        shell: bash
        run: git rev-parse HEAD > out/source-commit.txt
      - name: Upload build outputs (not installers)
        uses: actions/upload-artifact@v7
        with:
          name: desktop-assets-${{ matrix.os }}-${{ github.sha }}
          path: out/
          if-no-files-found: error
          retention-days: 7

  electron:
    name: Hidden Electron journeys and Swift
    needs: scope
    if: ${{ !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.electron == 'true' }}
    runs-on: macos-15
    timeout-minutes: 35
    env:
      ORCA_COMPUTER_MACOS_SIGN_IDENTITY: '-'
      ORCA_KEYBOARD_LAYOUT_MACOS_SIGN_IDENTITY: '-'
      ORCA_NOTIFICATION_STATUS_MACOS_SIGN_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: electron
          cache-electron-package: 'true'
      - name: Install Electron binary
        run: node config/scripts/install-electron-package-binary.mjs
      - name: Build Swift components from source
        run: |
          pnpm run build:computer-macos
          pnpm run build:keyboard-layout-macos
          pnpm run build:notification-status-macos
      - name: Build test renderer
        run: |
          pnpm run build:cli
          pnpm exec electron-vite build --mode e2e
      - name: Prepare isolated background-only Electron
        shell: bash
        run: |
          node config/scripts/prepare-fork-audit-electron.mjs
          printf 'ORCA_FORK_AUDIT_ELECTRON=%s/.tmp/fork-audit/Electron Background.app/Contents/MacOS/Electron\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Exercise project navigation and task boards
        env:
          SKIP_BUILD: '1'
        run: >-
          pnpm exec playwright test
          tests/e2e/fork-nested-project-tree.spec.ts
          tests/e2e/fork-project-navigation.spec.ts
          tests/e2e/fork-project-task-scope.spec.ts
          tests/e2e/fork-vibe-board.spec.ts
          tests/e2e/fork-five-projects.spec.ts
          tests/e2e/fork-beta-update.spec.ts
          tests/e2e/fork-project-tasks.spec.ts
          tests/e2e/fork-task-rpc-discovery.spec.ts
          tests/e2e/fork-packaged-tasks.spec.ts
          tests/e2e/fork-account-pool-settings.spec.ts
          tests/e2e/fork-worker-capacity-settings.spec.ts
          --config tests/playwright.config.ts --project electron-headless --workers=1
      - name: Save task lifecycle visual evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: task-ui-evidence-${{ github.sha }}
          path: test-results/**/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Install pinned Codex for the account-free terminal contract
        shell: bash
        run: npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/opka-codex-contract" '@openai/codex@0.160.0'
      - name: Exercise actual Codex command tools with local scripted responses
        env:
          SKIP_BUILD: '1'
          ORCA_CODEX_TERMINAL_SCRIPTED: '1'
          ORCA_REAL_CODEX_BINARY: ${{ runner.temp }}/opka-codex-contract/node_modules/@openai/codex-darwin-arm64/vendor/aarch64-apple-darwin/bin/codex
        run: >-
          pnpm exec playwright test tests/e2e/fork-task-real-terminal-codex.spec.ts
          --config tests/playwright.config.ts --project electron-headless --workers=1
      - name: Save account-free Codex contract evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: codex-terminal-evidence-${{ github.sha }}
          path: |
            test-results/**/*.png
            test-results/**/real-terminal-task-receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Save isolated failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: electron-failure-${{ github.sha }}
          path: test-results/
          retention-days: 7

  installers:
    name: Beta installer qualification
    needs: scope
    if: ${{ !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.installers == 'true' }}
    uses: ./.github/workflows/opka-installers.yml
    secrets: inherit
    with:
      build_android: ${{ needs.scope.outputs.android != 'true' }}
      version: ${{ inputs.release_version || format('1.4.236-rc.{0}', github.run_number) }}

  android:
    name: Android component acceptance
    needs: scope
    if: ${{ !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.android == 'true' }}
    uses: ./.github/workflows/opka-android-update-acceptance.yml
    secrets: inherit

  verify:
    name: PR checks passed
    if: ${{ !cancelled() && github.event.pull_request.draft != true }}
    needs: [scope, static, regression, desktop, electron, installers, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
      - name: Require every selected check and reject unexplained skips
        env:
          OPKA_CI_RESULTS: ${{ toJSON(needs) }}
          OPKA_CI_SCOPE: ${{ needs.scope.outputs.plan }}
        run: node config/scripts/opka-ci-component-scope.mjs --verify
      - name: Preserve successful source qualification
        uses: actions/upload-artifact@v7
        with:
          name: opka-ci-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/opka-ci/qualification.json
          if-no-files-found: error
          retention-days: 30
