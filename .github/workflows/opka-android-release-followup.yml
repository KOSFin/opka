name: Qualify already built Opka Android release
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: opka-android-release-followup-rc8
  cancel-in-progress: false
env:
  ORCA_BACKGROUND_LAUNCH: '1'
  ORCA_TELEMETRY_DISABLED: '1'
  OPKA_MOBILE_BUILD: '1'
  EXPO_NO_TELEMETRY: '1'
  HUSKY: '0'
  CANDIDATE_VERSION: 1.4.236-rc.8
  RELEASE_SIGNER: 'true'
jobs:
  followup:
    name: Existing signed rc8 APK navigation and original rc7 update
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: opka-android-release
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      OPKA_ANDROID_CERTIFICATE_SHA256: ${{ vars.OPKA_ANDROID_CERTIFICATE_SHA256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 128
      - uses: ./.github/actions/prepare-android-build-storage
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: KOSFin/opka
          run-id: 41326135452
          artifact-ids: 13092296535
          path: out/android-release-followup
          merge-multiple: true
      - name: Download the original published baseline without modification
        run: gh release download v1.4.236-rc.7 --repo KOSFin/opka --pattern latest-android.json --pattern opka-android.apk --dir out/android-idle-baseline
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: 'false'
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
      - name: Verify source qualification, build provenance, payload and release identity
        run: python3 config/scripts/opka-android-release-followup.py --verify-inputs
      - uses: ./.github/actions/install-mobile-dependencies
      - name: Check only the changed headless project metadata boundary
        run: node node_modules/vitest/vitest.mjs run --config mobile/vitest.config.ts mobile/src/host-screen/host-screen-reply-schema.test.ts mobile/src/worktree/project-section-catalog.test.ts mobile/src/worktree/project-group-workspace-sections.test.ts --maxWorkers=1
      - name: Build only the disposable synthetic host and generated web pages
        env:
          OPKA_VERSION: ${{ env.CANDIDATE_VERSION }}
          ORCA_LOCAL_BUILD_VERSION: ${{ env.CANDIDATE_VERSION }}
        run: |
          pnpm build:mobile-web
          pnpm build:orcad
          pnpm exec esbuild config/scripts/opka-android-ui-fixture.mjs --bundle --platform=node --format=esm --packages=external --define:__filename=import.meta.filename --define:__dirname=import.meta.dirname --outfile=out/android-ui-fixture/fixture.mjs
          CI=true node out/android-ui-fixture/fixture.mjs --check --ready-file "$RUNNER_TEMP/opka-ui-preflight-private.json" --summary-file out/android-native-ui/host-preflight.json
      - name: Require accelerated disposable emulator
        run: |
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel
          cores: 2
          ram-size: 2048M
          disk-size: 2048M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on -writable-system
          script: python3 config/scripts/opka-android-release-followup.py
      - name: Save bounded public acceptance receipts and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: opka-android-rc8-built-artifact-followup-${{ github.sha }}
          path: |
            out/android-release-followup/verified-inputs.json
            out/android-release-followup/stage-outcomes.json
            out/android-release-followup/ui/
            out/android-release-followup/native/
            out/android-native-ui/host-preflight.json
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve successful exact-APK test proof for publication
        uses: actions/upload-artifact@v7
        with:
          name: opka-rc8-tested-apk-${{ github.run_id }}
          path: |
            out/android-release-followup/verified-inputs.json
            out/android-release-followup/stage-outcomes.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve the separately versioned tested server-web component
        uses: actions/upload-artifact@v7
        with:
          name: opka-rc8-server-web-${{ github.run_id }}
          path: out/mobile-web-release-patch/
          if-no-files-found: error
          retention-days: 14
  publish:
    name: Publish the unchanged qualified installer asset set
    needs: followup
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: opka-android-release
    permissions:
      contents: write
      actions: read
    env:
      OPKA_VERSION: 1.4.236-rc.8
      OPKA_BUILT_SOURCE: 7dd0171c86df322353709f10bde5bb98ceee9d23
      OPKA_REQUIRE_ANDROID_CERTIFICATE_SHA256: ${{ vars.OPKA_ANDROID_CERTIFICATE_SHA256 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 7dd0171c86df322353709f10bde5bb98ceee9d23
          persist-credentials: false
      - name: Verify the successful original asset-set producer and artifact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$OPKA_BUILT_SOURCE"
          gh api repos/KOSFin/opka/actions/runs/41326135452 > "$RUNNER_TEMP/opka-build-run.json"
          gh api --paginate --slurp 'repos/KOSFin/opka/actions/runs/41326135452/jobs?filter=latest&per_page=100' > "$RUNNER_TEMP/opka-build-jobs.json"
          gh api repos/KOSFin/opka/actions/artifacts/13092247195 > "$RUNNER_TEMP/opka-asset-artifact.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          source = os.environ['OPKA_BUILT_SOURCE']
          run = json.loads((root / 'opka-build-run.json').read_text())
          assert run['id'] == 41326135452 and run['head_sha'] == source and run['path'] == '.github/workflows/opka-release.yml'
          jobs = [job for page in json.loads((root / 'opka-build-jobs.json').read_text()) for job in page['jobs']]
          assert any(job['name'].split(' / ')[-1] == 'Complete beta asset set' and job['head_sha'] == source and job['run_id'] == run['id'] and job['status'] == 'completed' and job['conclusion'] == 'success' for job in jobs)
          artifact = json.loads((root / 'opka-asset-artifact.json').read_text())
          assert artifact['id'] == 13092247195 and not artifact['expired'] and artifact['name'] == f'opka-beta-release-{source}'
          assert artifact['workflow_run']['id'] == run['id'] and artifact['workflow_run']['head_sha'] == source
          PY
      - uses: ./.github/actions/install-node-dependencies
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: KOSFin/opka
          run-id: 41326135452
          artifact-ids: 13092247195
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: opka-rc8-tested-apk-${{ github.run_id }}
          path: ${{ runner.temp }}/opka-tested-apk
      - name: Require the published APK to be the exact successfully tested APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'opka-tested-apk'
          proof = json.loads((root / 'verified-inputs.json').read_text())
          assert proof['sourceCommit'] == os.environ['OPKA_BUILT_SOURCE'] and proof['buildRun'] == 41326135452
          assert proof['artifactId'] == 13092296535 and proof['version'] == os.environ['OPKA_VERSION']
          assert proof['signedApkRebuilt'] is False
          assert proof['webSourceCommit'] == os.environ['GITHUB_SHA']
          assert len(proof['webBuildId']) == 64
          outcome = json.loads((root / 'stage-outcomes.json').read_text())
          stages = outcome['stages']
          assert outcome['allPassed'] is True and len(stages) == 2
          assert {stage['stage'] for stage in stages} == {'real-ui', 'original-rc7-native-update'}
          assert all(stage['status'] == 'passed' for stage in stages)
          with Path('dist/opka-android.apk').open('rb') as stream:
              assert hashlib.file_digest(stream, 'sha256').hexdigest() == proof['apkSha256']
          PY
      - name: Recheck original provenance, identity and every unchanged payload
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPKA_REQUIRE_ANDROID_CERTIFICATE_SHA256"
          sha256sum dist/* > "$RUNNER_TEMP/opka-original-asset-hashes"
          node config/scripts/opka-release-assets.mjs complete dist
          sha256sum dist/* > "$RUNNER_TEMP/opka-qualified-asset-hashes"
          diff -u "$RUNNER_TEMP/opka-original-asset-hashes" "$RUNNER_TEMP/opka-qualified-asset-hashes"
      - uses: actions/download-artifact@v8
        with:
          name: opka-rc8-server-web-${{ github.run_id }}
          path: webpatch
      - name: Verify the independent tested server-web component without changing core assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, tarfile
          from pathlib import Path
          root = Path('webpatch')
          archive = root / 'opka-mobile-web-rc8.tar.gz'
          sidecar = root / 'opka-mobile-web-provenance.json'
          sums = root / 'opka-mobile-web-SHA256SUMS'
          assert {path.name for path in root.iterdir()} == {archive.name, sidecar.name, sums.name}
          proof = json.loads((Path(os.environ['RUNNER_TEMP']) / 'opka-tested-apk/verified-inputs.json').read_text())
          metadata = json.loads(sidecar.read_text())
          assert metadata['schemaVersion'] == 1 and metadata['sourceCommit'] == proof['webSourceCommit'] == os.environ['GITHUB_SHA']
          assert metadata['baseBinarySource'] == os.environ['OPKA_BUILT_SOURCE'] and metadata['version'] == os.environ['OPKA_VERSION']
          assert metadata['buildId'] == proof['webBuildId'] and metadata['testedApkSha256'] == proof['apkSha256']
          with archive.open('rb') as stream:
              assert metadata['tarSha256'] == hashlib.file_digest(stream, 'sha256').hexdigest()
          assert archive.stat().st_size == metadata['tarBytes']
          with tarfile.open(archive) as package:
              members = package.getmembers()
              assert all(member.isfile() for member in members)
              manifest_bytes = package.extractfile('manifest.json').read()
              assert hashlib.sha256(manifest_bytes).hexdigest() == metadata['manifestSha256']
              manifest = json.loads(manifest_bytes)
              assert manifest['buildId'] == metadata['buildId']
              names = ['manifest.json', *[asset['path'] for asset in manifest['assets']]]
              assert len(members) == len(names) and {member.name for member in members} == set(names)
              assert all(not name.startswith('/') and '\\' not in name and not any(part in ('', '.', '..') for part in name.split('/')) for name in names)
          expected = ''
          for path in (archive, sidecar):
              with path.open('rb') as stream:
                  expected += hashlib.file_digest(stream, 'sha256').hexdigest() + '  ' + path.name + '\n'
          assert sums.read_text() == expected
          PY
      - name: Refuse replacing any existing tag or release
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/v$OPKA_VERSION"; then
            echo 'This version already exists; refusing replacement.' >&2
            exit 1
          else
            result=$?
            [ "$result" = 2 ] || exit "$result"
          fi
          if gh release view "v$OPKA_VERSION" >/dev/null 2>&1; then
            echo 'This release already exists; refusing replacement.' >&2
            exit 1
          fi
      - name: Upload the original built assets as draft then publish
        shell: bash
        run: |
          set -euo pipefail
          cp fork-docs/releases/beta-notes.md "$RUNNER_TEMP/opka-release-notes.md"
          printf '\nServer mobile pages: apply the separately checksummed opka-mobile-web-rc8.tar.gz component alongside this server release. Its provenance records the tested web source; APK, Mac and backend binaries retain their original build source.\n' >> "$RUNNER_TEMP/opka-release-notes.md"
          gh release create "v$OPKA_VERSION" dist/* webpatch/* --target "$OPKA_BUILT_SOURCE" --draft --prerelease --title "Opka $OPKA_VERSION — Mac and Android beta" --notes-file "$RUNNER_TEMP/opka-release-notes.md"
          gh release edit "v$OPKA_VERSION" --draft=false --prerelease --latest=false
      - name: Verify the immutable built-source tag and published asset metadata
        shell: bash
        run: |
          set -euo pipefail
          published=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$OPKA_VERSION" --jq '.object.sha')
          [ "$published" = "$OPKA_BUILT_SOURCE" ]
          python3 - <<'PY'
          import hashlib, json, os, subprocess, time
          from pathlib import Path
          paths = [path for directory in ('dist', 'webpatch') for path in Path(directory).iterdir() if path.is_file()]
          files = {path.name: path for path in paths}
          assert len(files) == len(paths), 'Core and web component filenames must not overlap'
          expected = {}
          for name, path in files.items():
              with path.open('rb') as stream:
                  expected[name] = 'sha256:' + hashlib.file_digest(stream, 'sha256').hexdigest()
          deadline = time.monotonic() + 60
          while True:
              remaining = deadline - time.monotonic()
              assert remaining > 0, 'Published SHA256 metadata did not become available within 60 seconds'
              release = json.loads(subprocess.check_output(['gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/releases/tags/v{os.environ["OPKA_VERSION"]}'], text=True, timeout=min(10, remaining)))
              assert release['tag_name'] == 'v' + os.environ['OPKA_VERSION'] and not release['draft'] and release['prerelease']
              assert {asset['name'] for asset in release['assets']} == set(files)
              for asset in release['assets']:
                  assert asset['state'] == 'uploaded' and asset['size'] == files[asset['name']].stat().st_size
                  if asset.get('digest'):
                      assert asset['digest'] == expected[asset['name']]
              if all(asset.get('digest') == expected[asset['name']] for asset in release['assets']):
                  break
              time.sleep(min(5, max(0, deadline - time.monotonic())))
          print(release['html_url'])
          PY
