name: Publish Opka beta
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New immutable beta version, for example 1.4.236-rc.1'
        type: string
        required: true
      built_run:
        description: 'Optional completed release build run to verify without rebuilding'
        type: string
        default: ''
      built_source:
        description: 'Exact original build commit; only reviewed QA changes may follow it'
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: opka-beta-publication
  cancel-in-progress: false

jobs:
  admission:
    name: Admit a main-only beta release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      release_source: ${{ steps.qualification.outputs.release_source }}
      artifact_run: ${{ steps.qualification.outputs.artifact_run }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 64
      - uses: ./.github/actions/install-node-dependencies
      - name: Validate the version without interpreting input as shell code
        env:
          OPKA_VERSION: ${{ inputs.version }}
        run: node --input-type=module -e 'import {validateBetaVersion} from "./config/scripts/opka-release-assets.mjs"; validateBetaVersion(process.env.OPKA_VERSION)'
      - name: Require qualified source and verify any reused immutable build
        id: qualification
        env:
          GH_TOKEN: ${{ github.token }}
          OPKA_QUALIFIED_COMMIT: ${{ github.sha }}
          OPKA_BUILT_RUN: ${{ inputs.built_run }}
          OPKA_BUILT_SOURCE: ${{ inputs.built_source }}
        run: node config/scripts/opka-release-qualification.mjs

  qualification:
    name: Build and qualify this version's installers
    needs: admission
    if: inputs.built_run == ''
    uses: ./.github/workflows/opka-installers.yml
    secrets: inherit
    with:
      version: ${{ inputs.version }}

  android_update:
    name: Verify the exact release APK update
    needs: [admission, qualification]
    if: ${{ !cancelled() && needs.admission.result == 'success' && (needs.qualification.result == 'success' || (inputs.built_run != '' && needs.qualification.result == 'skipped')) }}
    uses: ./.github/workflows/opka-android-update-acceptance.yml
    secrets: inherit
    with:
      release_signer: true
      candidate_version: ${{ inputs.version }}
      candidate_artifact: ${{ format('opka-android-{0}', needs.admission.outputs.release_source) }}
      candidate_run_id: ${{ needs.admission.outputs.artifact_run }}
      candidate_source: ${{ needs.admission.outputs.release_source }}

  publish:
    name: Publish the complete verified beta
    needs: [admission, qualification, android_update]
    if: ${{ !cancelled() && needs.admission.result == 'success' && needs.android_update.result == 'success' && (needs.qualification.result == 'success' || (inputs.built_run != '' && needs.qualification.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      OPKA_VERSION: ${{ inputs.version }}
      OPKA_RELEASE_SOURCE: ${{ needs.admission.outputs.release_source }}
      GH_TOKEN: ${{ github.token }}
      OPKA_REQUIRE_ANDROID_CERTIFICATE_SHA256: ${{ vars.OPKA_ANDROID_CERTIFICATE_SHA256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.admission.outputs.release_source }}
          path: .release-source
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: opka-beta-release-${{ needs.admission.outputs.release_source }}
          path: dist
          run-id: ${{ needs.admission.outputs.artifact_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: opka-android-tested-${{ github.sha }}
          path: tested-android
      - name: Require the published APK to be the exact OS-tested artifact
        run: node config/scripts/opka-verify-tested-android.mjs dist tested-android/candidate-artifact.json
      - name: Require the user-owned Android signing identity
        run: test -n "$OPKA_REQUIRE_ANDROID_CERTIFICATE_SHA256"
      - name: Recheck original build provenance without changing installer bytes
        working-directory: .release-source
        run: |
          python3 - <<'PYCODE'
          import hashlib, os, pathlib, subprocess
          directory = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'dist'
          def inventory():
              result = {}
              for path in directory.iterdir():
                  assert path.is_file() and not path.is_symlink()
                  digest = hashlib.sha256()
                  with path.open('rb') as source:
                      while chunk := source.read(1024 * 1024):
                          digest.update(chunk)
                  result[path.name] = digest.hexdigest()
              return result
          before = inventory()
          subprocess.run(['node', 'config/scripts/opka-release-assets.mjs', 'complete', str(directory)], check=True)
          assert before == inventory(), 'Qualification changed original release files'
          PYCODE
      - name: Refuse replacing any existing tag or release
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/v$OPKA_VERSION"; then
            echo 'This version already exists; choose a new version.' >&2
            exit 1
          else
            result=$?
            [ "$result" = 2 ] || exit "$result"
          fi
          if gh release view "v$OPKA_VERSION" >/dev/null 2>&1; then
            echo 'This release already exists; choose a new version.' >&2
            exit 1
          fi
      - name: Upload as a draft before making the channel visible
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v$OPKA_VERSION" dist/* --target "$OPKA_RELEASE_SOURCE" --draft --prerelease --title "Opka $OPKA_VERSION — Mac and Android beta" --notes-file fork-docs/releases/beta-notes.md
          gh release edit "v$OPKA_VERSION" --draft=false --prerelease --latest=false
      - name: Verify the remote release and immutable tag
        shell: bash
        run: |
          set -euo pipefail
          gh release view "v$OPKA_VERSION" --json url,isDraft,isPrerelease,assets
          published=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$OPKA_VERSION" --jq '.object.sha')
          [ "$published" = "$OPKA_RELEASE_SOURCE" ]
