name: Opka Android OS update acceptance
on:
  workflow_call:
    inputs:
      candidate_artifact:
        type: string
        default: ''
      candidate_run_id:
        type: string
        default: ''
      candidate_source:
        type: string
        default: ''
      release_signer:
        type: boolean
        default: false
      published_version:
        type: string
        default: ''
      update_surface:
        type: string
        default: 'settings'
      candidate_version:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      candidate_artifact:
        description: Exact qualified installer artifact (protected release only)
        type: string
        default: ''
      candidate_run_id:
        type: string
        default: ''
      candidate_source:
        type: string
        default: ''
      release_signer:
        description: Use the protected Opka release identity instead of a disposable CI identity
        type: boolean
        default: false
      published_version:
        description: Published beta to download through the existing app UI (requires release_signer)
        type: string
        default: ''
      update_surface:
        description: Existing updater entry point for the published-channel check
        type: choice
        options: [settings, home]
        default: settings
      candidate_version:
        description: Unpublished candidate version for release-identity qualification
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: opka-android-os-update-${{ github.ref }}
  cancel-in-progress: false
env:
  ORCA_BACKGROUND_LAUNCH: '1'
  ORCA_TELEMETRY_DISABLED: '1'
  OPKA_MOBILE_BUILD: '1'
  EXPO_NO_TELEMETRY: '1'
  HUSKY: '0'
jobs:
  update_confirmation:
    name: Opka Android installer confirmation and retained state
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    environment: ${{ github.event_name != 'pull_request' && inputs.release_signer && 'opka-android-release' || 'opka-android-ci' }}
    env:
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id || github.run_id }}
      CANDIDATE_SOURCE: ${{ inputs.candidate_source || github.sha }}
      CANDIDATE_ARTIFACT: ${{ inputs.candidate_artifact || '' }}
      CANDIDATE_ARTIFACT_DIR: ${{ inputs.candidate_artifact && 'out/android-release-candidate' || '' }}
      OPKA_ANDROID_CERTIFICATE_SHA256: ${{ vars.OPKA_ANDROID_CERTIFICATE_SHA256 }}
      PUBLISHED_VERSION: ${{ inputs.published_version || '' }}
      RELEASE_SIGNER: ${{ github.event_name != 'pull_request' && inputs.release_signer || false }}
      UPDATE_SURFACE: ${{ inputs.update_surface || 'settings' }}
      CANDIDATE_VERSION: ${{ inputs.release_signer && (inputs.candidate_version || '1.4.236-rc.8') || '1.4.236-rc.6' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate published-channel scope
        run: python3 -c 'import os,re; v=os.environ["PUBLISHED_VERSION"]; assert not v or (os.environ["RELEASE_SIGNER"] == "true" and re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*",v)), "Published acceptance requires release_signer and a beta version"'
      - name: Validate exact installer artifact scope
        run: python3 -c 'import os; a=os.environ["CANDIDATE_ARTIFACT"]; assert not a or (os.environ["RELEASE_SIGNER"] == "true" and a == "opka-android-" + os.environ["CANDIDATE_SOURCE"]), "Only an explicitly sourced protected installer artifact is admitted"'
      - name: Validate candidate version as data
        run: python3 -c 'import os,re; assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*",os.environ["CANDIDATE_VERSION"]), "Invalid candidate beta version"'
      - name: Validate published download argument contract offline
        run: python3 config/scripts/opka_android_published_update_test.py
      - name: Validate idle baseline and traffic measurement contracts
        run: |
          python3 config/scripts/opka_android_built_run_test.py
          python3 config/scripts/opka_android_baseline_artifact_test.py
          python3 mobile/scripts/android_batterystats_test.py
          python3 config/scripts/opka_android_fixture_proxy_test.py
          python3 config/scripts/opka_android_ci_acceptance_test.py
          python3 config/scripts/opka_android_ui_journey_test.py
          python3 config/scripts/opka_android_task_fields_test.py
      - uses: ./.github/actions/prepare-android-build-storage
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
      - uses: ./.github/actions/install-mobile-dependencies
      - name: Build the current synthetic host and generated mobile pages
        env:
          OPKA_VERSION: ${{ env.CANDIDATE_VERSION }}
          ORCA_LOCAL_BUILD_VERSION: ${{ env.CANDIDATE_VERSION }}
        run: |
          pnpm build:mobile-web
          pnpm build:orcad
          pnpm exec esbuild config/scripts/opka-android-ui-fixture.mjs --bundle --platform=node --format=esm --packages=external --define:__filename=import.meta.filename --define:__dirname=import.meta.dirname --outfile=out/android-ui-fixture/fixture.mjs
          CI=true node out/android-ui-fixture/fixture.mjs --check --ready-file "$RUNNER_TEMP/opka-ui-preflight-private.json" --summary-file out/android-native-ui/host-preflight.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: 'false'
      - name: Verify the immutable installer producer run
        if: inputs.candidate_artifact != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 config/scripts/opka_android_built_run.py
      - name: Download the exact already qualified installer
        if: inputs.candidate_artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.candidate_artifact }}
          path: out/android-release-candidate
          run-id: ${{ env.CANDIDATE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Verify installer identity and payload without modifying it
        if: inputs.candidate_artifact != ''
        run: python3 config/scripts/opka_android_candidate_artifact.py --directory out/android-release-candidate --output out/android-native-ui/candidate-artifact.json
      - name: Prepare own Firebase Android configuration
        if: inputs.candidate_artifact == ''
        id: firebase
        uses: ./.github/actions/prepare-opka-firebase
        env:
          OPKA_GOOGLE_SERVICES_JSON: ${{ secrets.OPKA_GOOGLE_SERVICES_JSON }}
      - name: Validate Android JavaScript before native compilation
        if: inputs.candidate_artifact == ''
        working-directory: mobile
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          OPKA_VERSION: ${{ env.CANDIDATE_VERSION }}
        run: pnpm exec expo export --platform android --no-bytecode --max-workers 1 --output-dir "$RUNNER_TEMP/opka-android-js-preflight"
      - name: Generate native regression project
        if: inputs.candidate_artifact == ''
        working-directory: mobile
        env:
          OPKA_VERSION: ${{ env.CANDIDATE_VERSION }}
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Test native update ownership, validation and cleanup
        if: inputs.candidate_artifact == ''
        working-directory: mobile/android
        run: ./gradlew :opka-app-update:testReleaseUnitTest :orca-mobile-web-shell:testReleaseUnitTest --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx2048m
      - name: Acquire and verify the published performance baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download v1.4.236-rc.7 --repo KOSFin/opka --pattern latest-android.json --pattern opka-android.apk --dir out/android-idle-baseline
          expected="$(python3 config/scripts/opka_android_baseline_artifact.py out/android-idle-baseline)"
          actual="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs out/android-idle-baseline/opka-android.apk | sed -n 's/Signer #1 certificate SHA-256 digest: //p')"
          test "$actual" = "$expected"
      - name: Fingerprint Android fixture inputs
        if: inputs.candidate_artifact == ''
        id: fixture_key
        env:
          FIREBASE_CLIENT_SHA256: ${{ steps.firebase.outputs.client_sha256 }}
          ANDROID_BUILD_ENV_SHA256: ${{ steps.firebase.outputs.build_env_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          input_hash="$(git ls-tree HEAD -- mobile src/shared src/packages config/patches package.json pnpm-lock.yaml pnpm-workspace.yaml .npmrc .github/actions .github/workflows/opka-android-update-acceptance.yml | sha256sum | cut -d ' ' -f 1)"
          echo "key=opka-android-fixtures-r6-candidate-v2-$CANDIDATE_VERSION-$RUNNER_OS-$RUNNER_ARCH-$input_hash-$FIREBASE_CLIENT_SHA256-$ANDROID_BUILD_ENV_SHA256" >> "$GITHUB_OUTPUT"
      - name: Restore unsigned Android fixtures
        if: inputs.candidate_artifact == ''
        id: fixture_cache
        uses: actions/cache/restore@v5
        with:
          path: out/android-update-fixtures/*-unsigned.apk
          key: ${{ steps.fixture_key.outputs.key }}
      - name: Build diagnostic APKs from current Android inputs
        if: inputs.candidate_artifact == '' && (steps.fixture_cache.outputs.cache-hit != 'true')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/android-update-fixtures
          for artifact in rc5 candidate; do
            if [ "$artifact" = rc5 ]; then export OPKA_VERSION=1.4.236-rc.5; else export OPKA_VERSION="$CANDIDATE_VERSION"; fi
            (cd mobile && pnpm exec expo prebuild --platform android --no-install)
            (cd mobile/android && ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx2048m)
            cp mobile/android/app/build/outputs/apk/release/app-release.apk "out/android-update-fixtures/$artifact-unsigned.apk"
          done
      - name: Save unsigned Android fixtures
        if: inputs.candidate_artifact == '' && (steps.fixture_cache.outputs.cache-hit != 'true')
        uses: actions/cache/save@v5
        with:
          path: out/android-update-fixtures/*-unsigned.apk
          key: ${{ steps.fixture_key.outputs.key }}
      - name: Build CI-only target-UID installer handoff
        if: inputs.candidate_artifact == ''
        run: python3 config/scripts/build-android-update-handoff.py
      - name: Sign both versions with one identity and verify it
        if: inputs.candidate_artifact == ''
        shell: bash
        env:
          RELEASE_SIGNER: ${{ github.event_name != 'pull_request' && inputs.release_signer || false }}
          OPKA_ANDROID_KEYSTORE_BASE64: ${{ secrets.OPKA_ANDROID_KEYSTORE_BASE64 }}
          OPKA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.OPKA_ANDROID_KEYSTORE_PASSWORD }}
          OPKA_ANDROID_CERTIFICATE_SHA256: ${{ vars.OPKA_ANDROID_CERTIFICATE_SHA256 }}
        run: |
          set -euo pipefail
          set +x
          signing_store="$RUNNER_TEMP/opka-update-acceptance.jks"
          trap 'rm -f "$signing_store"' EXIT
          if [ "$RELEASE_SIGNER" = true ]; then
            [ -n "$OPKA_ANDROID_KEYSTORE_BASE64" ] && [ -n "$OPKA_ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$OPKA_ANDROID_CERTIFICATE_SHA256" ] || { echo 'Protected Android signing secrets were not forwarded to this workflow.' >&2; exit 1; }
            python3 -c 'import base64,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"opka-update-acceptance.jks"; p.write_bytes(base64.b64decode(os.environ["OPKA_ANDROID_KEYSTORE_BASE64"],validate=True)); p.chmod(0o600)'
          else
            export OPKA_ANDROID_KEYSTORE_PASSWORD="$(openssl rand -hex 32)"
            keytool -genkeypair -keystore "$signing_store" -alias opka-beta -storetype JKS -keyalg RSA -keysize 3072 -validity 10 -dname 'CN=Opka CI Test' -storepass:env OPKA_ANDROID_KEYSTORE_PASSWORD -keypass:env OPKA_ANDROID_KEYSTORE_PASSWORD
          fi
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          for artifact in rc5 candidate; do
            "$apksigner" sign --ks "$signing_store" --ks-key-alias opka-beta --ks-pass env:OPKA_ANDROID_KEYSTORE_PASSWORD --key-pass env:OPKA_ANDROID_KEYSTORE_PASSWORD --out "out/android-update-fixtures/$artifact.apk" "out/android-update-fixtures/$artifact-unsigned.apk"
            certificate="$("$apksigner" verify --verbose --print-certs "out/android-update-fixtures/$artifact.apk" | sed -n 's/Signer #1 certificate SHA-256 digest: //p')"
            if [ "$RELEASE_SIGNER" = true ]; then
              [ "$certificate" = "$OPKA_ANDROID_CERTIFICATE_SHA256" ]
            fi
            if [ "$artifact" = rc5 ]; then first_certificate="$certificate"; else [ "$certificate" = "$first_certificate" ]; fi
          done
          "$apksigner" sign --ks "$signing_store" --ks-key-alias opka-beta --ks-pass env:OPKA_ANDROID_KEYSTORE_PASSWORD --key-pass env:OPKA_ANDROID_KEYSTORE_PASSWORD --out out/android-update-handoff/handoff.apk out/android-update-handoff/handoff-aligned.apk
          handoff_certificate="$("$apksigner" verify --print-certs out/android-update-handoff/handoff.apk | sed -n 's/Signer #1 certificate SHA-256 digest: //p')"
          [ "$handoff_certificate" = "$first_certificate" ]
          printf '%s\n' "$RELEASE_SIGNER" > out/android-update-fixtures/release-signer.txt
      - name: Cache the pinned Google APIs system image
        uses: actions/cache@v5
        with:
          path: ${{ env.ANDROID_HOME }}/system-images/android-33/google_apis/x86_64
          key: opka-avd-api33-google-apis-x86_64-r17
      - name: Install and require Google APIs API33 image revision 17
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'system-images;android-33;google_apis;x86_64'
          python3 - <<'PYIMAGE'
          import json, os
          from pathlib import Path
          path = Path(os.environ['ANDROID_HOME']) / 'system-images/android-33/google_apis/x86_64/source.properties'
          props = dict(line.split('=', 1) for line in path.read_text().splitlines() if '=' in line)
          props = {key.strip(): value.strip() for key, value in props.items()}
          assert props['Pkg.Revision'] == '17' and props['AndroidVersion.ApiLevel'] == '33'
          assert props['SystemImage.TagId'] == 'google_apis' and props['SystemImage.Abi'] == 'x86_64'
          target = Path('out/android-native-ui')
          target.mkdir(parents=True, exist_ok=True)
          (target / 'system-image.json').write_text(json.dumps({key: props[key] for key in ['Pkg.Revision', 'AndroidVersion.ApiLevel', 'SystemImage.TagId', 'SystemImage.Abi']}, indent=2) + '\n')
          PYIMAGE
      - name: Require KVM acceleration
        run: |
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Exercise Android confirmation and data retention
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel
          cores: 2
          ram-size: 2048M
          disk-size: 2048M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on -writable-system
          pre-emulator-launch-script: |
            df -h "$HOME/.android"
            python3 -c 'import os,shutil; assert shutil.disk_usage(os.path.expanduser("~/.android")).free >= 3 * 1024**3, "Android update acceptance requires 3 GiB free before emulator boot"'
          script: python3 config/scripts/opka-android-ci-acceptance.py
      - name: Save acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: opka-android-os-update-${{ github.sha }}
          path: |
            out/android-update-acceptance/
            out/android-update-fixtures/release-signer.txt
            out/android-idle-performance/
            out/android-native-update-acceptance/
            out/android-native-ui/
            mobile/modules/opka-app-update/android/build/test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Save exact tested installer identity for publication
        if: success() && inputs.candidate_artifact != ''
        uses: actions/upload-artifact@v7
        with:
          name: opka-android-tested-${{ github.sha }}
          path: |
            out/android-native-ui/candidate-artifact.json
            out/android-native-ui/stage-outcomes.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary Firebase configuration
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/opka-google-services.json"
